# The Apps runtime assigns the port the gateway expects via DATABRICKS_APP_PORT —
# a hardcoded 8080 leaves the process alive but unreachable (permanent 502).
# sh -c is required because argv entries don't expand environment variables.
command: ["sh", "-c", "streamlit run app.py --server.port ${DATABRICKS_APP_PORT:-8080} --server.address 0.0.0.0"]